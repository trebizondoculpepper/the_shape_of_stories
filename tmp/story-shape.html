<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Story Plot Tool</title>
<style>
  html, body, #root { margin: 0; padding: 0; height: 100%; background: #fdfdfc; }
  * { box-sizing: border-box; }
  #load-error { display:none; font-family: monospace; white-space: pre-wrap; padding: 20px; color: #a33; background: #fff4f4; }
</style>
</head>
<body>
<div id="root"><div style="padding:24px;font-family:system-ui,sans-serif;color:#888;">Loading Story Plot Tool…</div></div>
<div id="load-error"></div>

<script>
  window.addEventListener('error', function (e) {
    var el = document.getElementById('load-error');
    el.style.display = 'block';
    el.textContent += 'Error: ' + e.message + (e.filename ? (' (' + e.filename + ':' + e.lineno + ')') : '') + '\n';
  });
</script>

<script>
  function loadScript(url, fallbackUrl) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = url;
      s.onload = resolve;
      s.onerror = function () {
        if (fallbackUrl) {
          var s2 = document.createElement('script');
          s2.src = fallbackUrl;
          s2.onload = resolve;
          s2.onerror = reject;
          document.head.appendChild(s2);
        } else {
          reject(new Error('Failed to load ' + url));
        }
      };
      document.head.appendChild(s);
    });
  }

  Promise.resolve()
    .then(function () { return loadScript(
      'https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js',
      'https://unpkg.com/react@18/umd/react.production.min.js'); })
    .then(function () { return loadScript(
      'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js',
      'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js'); })
    .then(function () { return loadScript(
      'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js',
      'https://unpkg.com/@babel/standalone/babel.min.js'); })
    .then(function () {
      var script = document.getElementById('app-source');
      var transformed = Babel.transform(script.textContent, { presets: ['react'] }).code;
      var el = document.createElement('script');
      el.textContent = transformed;
      document.body.appendChild(el);
    })
    .catch(function (err) {
      var el = document.getElementById('load-error');
      el.style.display = 'block';
      el.textContent += 'Load failure: ' + err.message + '\n';
    });
</script>

<script type="text/babel-source" id="app-source">
const { useState, useEffect, useRef, useMemo } = React;

function MiniLineChart({ data, keys, height = 280, zones = null, dimmed = [], onToggleDim = null }) {
  const width = 760;
  const padL = 40, padR = 16, padT = 16, padB = 30;
  const innerW = width - padL - padR, innerH = height - padT - padB;
  if (!data || data.length === 0) return null;

  let allVals = [];
  data.forEach(row => keys.forEach(k => { if (typeof row[k.key] === 'number') allVals.push(row[k.key]); }));
  if (allVals.length === 0) allVals = [0, 1];
  let min = Math.min(...allVals, 0), max = Math.max(...allVals, 0);
  if (min === max) { min -= 1; max += 1; }
  const xForI = (i) => padL + (data.length <= 1 ? 0 : (innerW * i) / (data.length - 1));
  const yForV = (v) => padT + innerH - ((v - min) / (max - min)) * innerH;
  const xForFrac = (f) => padL + innerW * f;

  const [hoverIdx, setHoverIdx] = useState(null);

  return (
    <div style={{ width: '100%', overflowX: 'auto' }}>
      <svg width={width} height={height} onMouseLeave={() => setHoverIdx(null)}>
        {zones && data.length > 1 && zones.map(z => (
          <g key={z.label}>
            {z.fill !== 'transparent' && (
              <rect x={xForFrac(z.from)} y={padT} width={xForFrac(z.to) - xForFrac(z.from)} height={innerH} fill={z.fill} />
            )}
            <text x={(xForFrac(z.from) + xForFrac(z.to)) / 2} y={padT + 12} fontSize={9} textAnchor="middle" fill="#999"
              style={{ textTransform: 'uppercase', letterSpacing: '.02em' }}>{z.label}</text>
          </g>
        ))}
        {[0, 0.25, 0.5, 0.75, 1].map((f, i) => {
          const y = padT + innerH * f;
          const val = (max - (max - min) * f).toFixed(1);
          return (
            <g key={i}>
              <line x1={padL} y1={y} x2={width - padR} y2={y} stroke="#eee" />
              <text x={padL - 6} y={y + 3} fontSize={10} textAnchor="end" fill="#999">{val}</text>
            </g>
          );
        })}
        {data.map((row, i) => (
          <rect key={i} x={xForI(i) - (innerW / data.length) / 2} y={padT} width={innerW / data.length} height={innerH}
            fill="transparent" onMouseEnter={() => setHoverIdx(i)} />
        ))}
        {keys.map(k => {
          const path = data.map((row, i) => {
            if (row[k.key] == null) return null;
            return `${i === 0 || data[i - 1][k.key] == null ? 'M' : 'L'} ${xForI(i)} ${yForV(row[k.key])}`;
          }).filter(Boolean).join(' ');
          return <path key={k.key} d={path} fill="none" stroke={k.color} strokeWidth={2} strokeDasharray={k.dash || undefined}
            opacity={dimmed.includes(k.key) ? 0.2 : 1} />;
        })}
        {hoverIdx != null && (
          <line x1={xForI(hoverIdx)} y1={padT} x2={xForI(hoverIdx)} y2={padT + innerH} stroke="#ccc" strokeDasharray="3 3" />
        )}
      </svg>
      <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', fontSize: 12, marginTop: 4 }}>
        {keys.map(k => (
          <span key={k.key} onClick={() => onToggleDim && onToggleDim(k.key)}
            style={{ display: 'flex', alignItems: 'center', gap: 4, cursor: onToggleDim ? 'pointer' : 'default', opacity: dimmed.includes(k.key) ? 0.35 : 1, userSelect: 'none' }}>
            <span style={{ width: 10, height: 10, background: k.color, display: 'inline-block', borderRadius: 2 }} />
            {k.name || k.key}
          </span>
        ))}
      </div>
      {hoverIdx != null && data[hoverIdx] && (
        <div style={{ fontSize: 11, color: '#666', marginTop: 2 }}>
          {data[hoverIdx].name}: {keys.map(k => `${k.name || k.key}=${data[hoverIdx][k.key] ?? '—'}`).join('  ')}
        </div>
      )}
    </div>
  );
}


/* ============================== CONSTANTS ============================== */

const ACT_COLORS = { 1: '#eef3fb', 2: '#fbf7ea', 3: '#fbf0e3', 4: '#fbeaea', 5: '#f3eefb' };
// Stable hash so a thread's color depends on its name, not its position in the threads array —
// deleting/reordering other threads no longer shifts everyone else's color.
function hashColorIndex(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h;
}
const ACT_BORDERS = { 1: '#aac1ec', 2: '#ecda9d', 3: '#ecc399', 4: '#e8a8a8', 5: '#cbb2ec' };
const UNASSIGNED_COLOR = '#f0eeec';
const UNASSIGNED_BORDER = '#c9c4bd';
const ACT_NAMES = { 1: 'Act I', 2: 'Act II', 3: 'Act III', 4: 'Act IV', 5: 'Act V' };
const ACTS = [1, 2, 3, 4, 5];

const BOLD_PALETTE = [
  { name: 'Blue', hex: '#86a6e4' },
  { name: 'Yellow', hex: '#e4cb74' },
  { name: 'Orange', hex: '#e4ab71' },
  { name: 'Red', hex: '#de8484' },
  { name: 'Purple', hex: '#b692e4' },
];
const SOFT_PALETTE = [
  { name: 'Sage', hex: '#9fd1a3' },
  { name: 'Aqua', hex: '#82d1c9' },
  { name: 'Rose', hex: '#eea6c3' },
  { name: 'Lime', hex: '#cbdc8f' },
  { name: 'Stone', hex: '#cdc5b8' },
];
const THREAD_COLOR_PALETTE = [
  { name: 'Violet', hex: '#7F77DD' },
  { name: 'Coral', hex: '#D85A30' },
  { name: 'Teal', hex: '#1D9E75' },
  { name: 'Pink', hex: '#D4537E' },
  { name: 'Amber', hex: '#BA7517' },
  { name: 'Blue', hex: '#378ADD' },
  { name: 'Green', hex: '#639922' },
  { name: 'Gray', hex: '#888780' },
];
const THREAD_COLORS = THREAD_COLOR_PALETTE.map(p => p.hex);

const CIRCLE_STAGES = ['You', 'Need', 'Go', 'Search', 'Find', 'Take', 'Return', 'Change'];

// Freytag's Pyramid, as background context bands on the Character Arcs chart — not a per-character
// value, just the classic dramatic-structure shape (short exposition, long rising action, a narrow
// climax, falling action, a short resolution). Proportions are a reasonable default, not tuned per story.
const FREYTAG_ZONES = [
  { label: 'Exposition', from: 0, to: 0.15, fill: '#f2f2f2' },
  { label: 'Rising Action', from: 0.15, to: 0.70, fill: 'transparent' },
  { label: 'Climax', from: 0.70, to: 0.78, fill: '#f6f0fb' },
  { label: 'Falling Action', from: 0.78, to: 0.92, fill: 'transparent' },
  { label: 'Resolution', from: 0.92, to: 1, fill: '#f2f2f2' },
];

// (Emotion/Action/Theme tag types removed — tag type is now free text the user defines, see tagTypes lib.)

function uid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}

function freshDefaultChapters() {
  return [{ id: uid(), title: 'Chapter 1' }];
}

function freshDefaultCards(chapterId) {
  const mk = (title, act, placeholder) => ({
    id: uid(), act, gapIndex: null, chapterId, title, text: '', notes: '',
    tags: [], values: [], placeholder, customColor: null, major: false,
  });
  return [
    mk('Beginning', 1, 'What is the status quo before the story begins?'),
    mk('Inciting Incident', 1, 'What event disrupts the status quo and sets the story in motion?'),
    mk('Rising Action', 2, 'What complications escalate the conflict?'),
    mk('Climax', 3, 'What is the peak confrontation or decision?'),
    mk('Falling Action', 4, 'What are the immediate consequences of the climax?'),
    mk('Resolution', 5, 'How does the story settle?'),
    mk('Loose Ends', 5, 'What threads resolve or remain deliberately open?'),
  ];
}

// Filters a card list down to one chapter, or returns all cards when chapterId is 'all'.
function filterByChapter(cards, chapterId) {
  return chapterId === 'all' ? cards : cards.filter(c => c.chapterId === chapterId);
}

const GENERIC_PLACEHOLDER = 'What change turns the plot?';

/* ============================== COLOR RESOLUTION ============================== */

function darkenHex(hex, amt) {
  const h = hex.replace('#', '');
  const num = parseInt(h, 16);
  let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
  r = Math.max(0, Math.round(r * (1 - amt)));
  g = Math.max(0, Math.round(g * (1 - amt)));
  b = Math.max(0, Math.round(b * (1 - amt)));
  return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
}

function resolveColor(card) {
  if (card.customColor) return card.customColor;
  if (card.act) return ACT_COLORS[card.act];
  return UNASSIGNED_COLOR;
}
function resolveBorder(card) {
  if (card.customColor) return darkenHex(card.customColor, 0.3);
  if (card.act) return ACT_BORDERS[card.act];
  return UNASSIGNED_BORDER;
}

/* ============================== VALUE CHAIN ============================== */

// When `chapters` is given, orders chapter-by-chapter then act-by-act within each chapter.
// Otherwise falls back to a flat act-only ordering (used once cards are already scoped to one chapter).
function getOrderedForValues(cards, chapters) {
  if (chapters && chapters.length) {
    return chapters.flatMap(ch => ACTS.flatMap(act => cards.filter(c => c.chapterId === ch.id && c.act === act)));
  }
  return ACTS.flatMap(act => cards.filter(c => c.act === act));
}

// Chronological position of every card: chapter order, then act order, then array order; unplaced cards last.
function chronoOrderMap(cards, chapters) {
  const placed = getOrderedForValues(cards, chapters);
  const seen = new Set(placed.map(c => c.id));
  const m = {};
  [...placed, ...cards.filter(c => !seen.has(c.id))].forEach((c, i) => { m[c.id] = i; });
  return m;
}
// Sorts thread steps by story position and numbers them 1..n.
function numberThreadSteps(steps, order) {
  return [...steps].sort((a, b) => (order[a.cardId] ?? 1e9) - (order[b.cardId] ?? 1e9)).map((s, i) => ({ ...s, step: i + 1 }));
}

// Reorders `arr` by moving the card at idx by `dir` positions. If the moved card is
// currently unassigned, it adopts the act of its new neighbor(s) (before takes priority).
function nudgeWithActAdoption(arr, idx, dir) {
  const j = idx + dir;
  if (j < 0 || j >= arr.length) return arr;
  const next = [...arr];
  [next[idx], next[j]] = [next[j], next[idx]];
  const moved = next[j];
  if (moved.act === null || moved.act === undefined) {
    const before = next[j - 1];
    const after = next[j + 1];
    const inherited = before ? before.act : (after ? after.act : null);
    if (inherited !== null && inherited !== undefined) next[j] = { ...moved, act: inherited };
  }
  return next;
}

function buildValueChain(cards, chapters) {
  const ordered = getOrderedForValues(cards, chapters);
  const openMap = {};
  const chain = {};
  ordered.forEach(card => {
    chain[card.id] = {};
    (card.values || []).forEach(v => {
      const open = openMap[v.name] !== undefined ? openMap[v.name] : 0;
      const close = open + (v.shift || 0);
      chain[card.id][v.name] = { open, close, isEvent: (v.shift || 0) !== 0 };
      openMap[v.name] = close;
    });
  });
  return { chain, ordered };
}

/* ============================== MARKDOWN EXPORT / IMPORT ============================== */

function esc(s) { return (s || '').replace(/\n/g, '\\n'); }
function unesc(s) { return (s || '').replace(/\\n/g, '\n'); }

function cardsToMarkdown(state) {
  const { cards, characters, themes, values, threads, chapters, tagTypes, threadNotes, threadColors, threadLanes, circleStages, circleStagesHidden, wordGoal, title } = state;
  let md = '# STORY PLOT DATA\n\n';
  md += '## Title\n- ' + esc(title || '') + '\n\n';
  md += '## Chapters\n' + (chapters || []).map(ch => `- ${ch.id} | ${esc(ch.title)}`).join('\n') + '\n\n';
  md += '## Characters\n' + characters.map(c => `- ${c}`).join('\n') + '\n\n';
  md += '## Themes\n' + themes.map(c => `- ${c}`).join('\n') + '\n\n';
  md += '## Values\n' + values.map(c => `- ${c}`).join('\n') + '\n\n';
  md += '## Threads\n' + threads.map(c => `- ${c}`).join('\n') + '\n\n';
  md += '## ThreadNotes\n' + threads.map(t => `- ${esc(t)} | ${esc((threadNotes && threadNotes[t]) || '')}`).join('\n') + '\n\n';
  md += '## ThreadColors\n' + threads.filter(t => threadColors && threadColors[t]).map(t => `- ${esc(t)} | ${threadColors[t]}`).join('\n') + '\n\n';
  md += '## ThreadLanes\n' + threads.filter(t => threadLanes && threadLanes[t] !== undefined).map(t => `- ${esc(t)} | ${threadLanes[t]}`).join('\n') + '\n\n';
  md += '## TagTypes\n' + (tagTypes || []).map(c => `- ${c}`).join('\n') + '\n\n';
  md += '## CircleStages\n' + ((circleStages && circleStages.length === 8) ? circleStages : CIRCLE_STAGES).map(c => `- ${esc(c)}`).join('\n') + '\n\n';
  md += '## CircleStagesHidden\n- ' + (!!circleStagesHidden) + '\n\n';
  md += '## WordGoal\n- ' + (wordGoal || '') + '\n\n';
  md += '## Cards\n\n';
  cards.forEach(card => {
    md += `### ${esc(card.title)}\n`;
    md += `- id: ${card.id}\n`;
    md += `- chapterId: ${card.chapterId || ''}\n`;
    md += `- act: ${card.act === null || card.act === undefined ? '' : card.act}\n`;
    md += `- gapIndex: ${card.gapIndex === null || card.gapIndex === undefined ? '' : card.gapIndex}\n`;
    md += `- major: ${!!card.major}\n`;
    md += `- color: ${card.customColor || ''}\n`;
    md += `- words: ${card.words ?? ''}\n`;
    md += `- wordTarget: ${card.wordTarget ?? ''}\n`;
    md += `- placeholder: ${esc(card.placeholder || '')}\n`;
    md += `- text: ${esc(card.text)}\n`;
    md += `- notes: ${esc(card.notes)}\n`;
    md += `- tags:\n`;
    (card.tags || []).forEach(t => {
      if (t.type === 'Thread') {
        md += `  - Thread | ${t.role} | ${esc(t.note)} | \n`;
      } else {
        md += `  - ${t.type} | ${esc(t.char || '')} | ${t.direction || 'up'} | ${esc(t.note || '')}\n`;
      }
    });
    md += `- values:\n`;
    (card.values || []).forEach(v => { md += `  - ${esc(v.name)} | ${v.shift}\n`; });
    md += '\n---\n\n';
  });
  return md;
}

function markdownToCards(md) {
  const lines = md.split('\n');
  const characters = [], themes = [], values = [], threads = [], chapters = [], tagTypes = [], circleStages = [];
  const threadNotes = {}; const threadColors = {}; const threadLanes = {};
  let circleStagesHidden = false;
  let wordGoal = null;
  let title = '';
  const cards = [];
  let section = null;
  let current = null;
  let listMode = null; // 'tags' | 'values'

  const pushCurrent = () => { if (current) cards.push(current); current = null; };

  for (let raw of lines) {
    const line = raw;
    const h2 = line.match(/^##\s+(.*)$/);
    const h3 = line.match(/^###\s+(.*)$/);
    if (h2) {
      pushCurrent();
      const name = h2[1].trim().toLowerCase();
      if (name === 'title') section = 'title';
      else if (name === 'chapters') section = 'chapters';
      else if (name === 'characters') section = 'characters';
      else if (name === 'themes') section = 'themes';
      else if (name === 'values') section = 'values';
      else if (name === 'threads') section = 'threads';
      else if (name === 'threadnotes') section = 'threadNotes';
      else if (name === 'threadcolors') section = 'threadColors';
      else if (name === 'threadlanes') section = 'threadLanes';
      else if (name === 'tagtypes') section = 'tagTypes';
      else if (name === 'circlestages') section = 'circleStages';
      else if (name === 'circlestageshidden') section = 'circleStagesHidden';
      else if (name === 'wordgoal') section = 'wordGoal';
      else if (name === 'cards') section = 'cards';
      else section = null;
      listMode = null;
      continue;
    }
    if (h3 && section === 'cards') {
      pushCurrent();
      current = {
        id: uid(), act: null, gapIndex: null, chapterId: null, title: unesc(h3[1].trim()), text: '', notes: '',
        tags: [], values: [], placeholder: GENERIC_PLACEHOLDER, customColor: null, major: false,
      };
      listMode = null;
      continue;
    }
    if (section === 'chapters') {
      const m = line.match(/^-\s+(.*)$/);
      if (m && m[1].trim()) {
        const parts = m[1].split('|').map(s => s.trim());
        chapters.push({ id: parts[0], title: unesc(parts[1] || parts[0]) });
      }
      continue;
    }
    if (section === 'cards' && current) {
      let m;
      if ((m = line.match(/^- id:\s*(.*)$/))) { if (m[1].trim()) current.id = m[1].trim(); listMode = null; continue; }
      if ((m = line.match(/^- chapterId:\s*(.*)$/))) { current.chapterId = m[1].trim() || null; listMode = null; continue; }
      if ((m = line.match(/^- act:\s*(.*)$/))) { const v = m[1].trim(); current.act = v ? parseInt(v, 10) : null; listMode = null; continue; }
      if ((m = line.match(/^- gapIndex:\s*(.*)$/))) { const v = m[1].trim(); current.gapIndex = v ? parseInt(v, 10) : null; listMode = null; continue; }
      if ((m = line.match(/^- major:\s*(.*)$/))) { current.major = m[1].trim() === 'true'; listMode = null; continue; }
      if ((m = line.match(/^- words:\s*(.*)$/))) { current.words = parseWords(m[1]); listMode = null; continue; }
      if ((m = line.match(/^- wordTarget:\s*(.*)$/))) { current.wordTarget = parseWords(m[1]); listMode = null; continue; }
      if ((m = line.match(/^- color:\s*(.*)$/))) { current.customColor = m[1].trim() || null; listMode = null; continue; }
      if ((m = line.match(/^- placeholder:\s*(.*)$/))) { current.placeholder = unesc(m[1]) || GENERIC_PLACEHOLDER; listMode = null; continue; }
      if ((m = line.match(/^- text:\s*(.*)$/))) { current.text = unesc(m[1]); listMode = null; continue; }
      if ((m = line.match(/^- notes:\s*(.*)$/))) { current.notes = unesc(m[1]); listMode = null; continue; }
      if (line.match(/^- tags:\s*$/)) { listMode = 'tags'; continue; }
      if (line.match(/^- values:\s*$/)) { listMode = 'values'; continue; }
      if (listMode === 'tags' && (m = line.match(/^\s{2}-\s*(.*)$/))) {
        const parts = m[1].split('|').map(s => s.trim());
        if (parts[0] === 'Thread') {
          const tag = { id: uid(), type: 'Thread', role: parts[1], note: unesc(parts[2] || '') };
          current.tags.push(tag);
        } else {
          current.tags.push({ id: uid(), type: parts[0], char: unesc(parts[1] || ''), direction: parts[2] || 'up', note: unesc(parts[3] || '') });
        }
        continue;
      }
      if (listMode === 'values' && (m = line.match(/^\s{2}-\s*(.*)$/))) {
        const parts = m[1].split('|').map(s => s.trim());
        current.values.push({ name: unesc(parts[0]), shift: parseFloat(parts[1]) || 0 });
        continue;
      }
      if (line.trim() === '---') { pushCurrent(); listMode = null; continue; }
      continue;
    }
    if (section === 'threadNotes') {
      const m = line.match(/^-\s+(.*)$/);
      if (m && m[1].trim()) {
        const parts = m[1].split('|');
        const name = unesc(parts[0].trim());
        const note = unesc((parts.slice(1).join('|') || '').trim());
        threadNotes[name] = note;
      }
      continue;
    }
    if (section === 'threadColors') {
      const m = line.match(/^-\s+(.*)$/);
      if (m && m[1].trim()) {
        const parts = m[1].split('|').map(s => s.trim());
        if (parts[1]) threadColors[unesc(parts[0])] = parts[1];
      }
      continue;
    }
    if (section === 'threadLanes') {
      const m = line.match(/^-\s+(.*)$/);
      if (m && m[1].trim()) {
        const parts = m[1].split('|').map(s => s.trim());
        if (parts[1] !== undefined && parts[1] !== '') threadLanes[unesc(parts[0])] = parseInt(parts[1], 10);
      }
      continue;
    }
    if (section === 'title') {
      const m = line.match(/^-\s+(.*)$/);
      if (m && m[1].trim()) title = unesc(m[1].trim());
      continue;
    }
    if (section === 'wordGoal') {
      const m = line.match(/^-\s+(.*)$/);
      if (m && m[1].trim()) wordGoal = parseWords(m[1]);
      continue;
    }
    if (section === 'circleStagesHidden') {
      const m = line.match(/^-\s+(.*)$/);
      if (m && m[1].trim()) circleStagesHidden = m[1].trim() === 'true';
      continue;
    }
    if (section && section !== 'cards') {
      const m = line.match(/^-\s+(.*)$/);
      if (m && m[1].trim()) {
        if (section === 'characters') characters.push(m[1].trim());
        else if (section === 'themes') themes.push(m[1].trim());
        else if (section === 'values') values.push(m[1].trim());
        else if (section === 'threads') threads.push(m[1].trim());
        else if (section === 'tagTypes') tagTypes.push(m[1].trim());
        else if (section === 'circleStages') circleStages.push(unesc(m[1].trim()));
      }
    }
  }
  pushCurrent();
  // Backward compatibility: older exports have no Chapters section / no chapterId on cards.
  let finalChapters = chapters;
  if (finalChapters.length === 0) {
    finalChapters = [{ id: uid(), title: 'Chapter 1' }];
  }
  const fallbackChapterId = finalChapters[0].id;
  cards.forEach(c => { if (!c.chapterId) c.chapterId = fallbackChapterId; });
  // Backward compatibility: older exports predate the TagTypes lib — derive it from tags in use.
  const finalTagTypes = tagTypes.length > 0 ? tagTypes : Array.from(new Set(
    cards.flatMap(c => (c.tags || []).filter(t => t.type !== 'Thread').map(t => t.type))
  ));
  // Backward compatibility: older exports predate stage labels — fall back to the defaults.
  const finalCircleStages = circleStages.length === 8 ? circleStages : CIRCLE_STAGES;
  return { cards, characters, themes, values, threads, tagTypes: finalTagTypes, threadNotes, threadColors, threadLanes, chapters: finalChapters, circleStages: finalCircleStages, circleStagesHidden, wordGoal, title };
}

/* ============================== TAG EDITOR ============================== */

function TagEditor({ tags, onChange, characters, threads, onAddThread, tagTypes, onAddTagType }) {
  const [kind, setKind] = useState('label'); // 'label' | 'thread'
  const [labelType, setLabelType] = useState('');
  const [selChars, setSelChars] = useState([]);
  const [direction, setDirection] = useState('up');
  const [note, setNote] = useState('');
  const [role, setRole] = useState('setup');
  const [threadName, setThreadName] = useState('');

  const addTags = () => {
    if (kind === 'thread') {
      const name = threadName.trim();
      if (!name) return;
      if (!threads.includes(name)) onAddThread(name);
      const tag = { id: uid(), type: 'Thread', role, note: name };
      onChange([...tags, tag]);
      setThreadName('');
    } else {
      const typeName = labelType.trim();
      if (!typeName || selChars.length === 0) return;
      if (!tagTypes.includes(typeName)) onAddTagType(typeName);
      const additions = selChars.map(c => ({ id: uid(), type: typeName, char: c, direction, note }));
      onChange([...tags, ...additions]);
      setSelChars([]); setNote('');
    }
  };
  const removeTag = (id) => onChange(tags.filter(t => t.id !== id));
  const threadTagLabel = (t) => t.role === 'step' ? 'Step' : (t.role === 'setup' ? 'Setup' : 'Payoff');

  return (
    <div style={{ fontSize: 12, border: '1px solid #eee', borderRadius: 8, padding: 8, marginTop: 6 }}>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4, marginBottom: 6 }}>
        {tags.map(t => (
          <span key={t.id} style={{ background: '#f4f4f4', borderRadius: 10, padding: '2px 8px', display: 'flex', alignItems: 'center', gap: 4 }}>
            {t.type === 'Thread'
              ? `Thread: ${t.note} (${threadTagLabel(t)})`
              : `${t.type}: ${t.char} ${t.direction === 'up' ? '↑' : '↓'}${t.note ? ' — ' + t.note : ''}`}
            <button onClick={() => removeTag(t.id)} style={{ border: 'none', background: 'none', cursor: 'pointer', color: '#999' }}>×</button>
          </span>
        ))}
      </div>
      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', alignItems: 'center' }}>
        <SegButtons value={kind} onChange={setKind} options={[['label', 'Tag'], ['thread', 'Thread']]} />
        {kind === 'label' ? (
          <>
            <input list="tag-type-lib" value={labelType} onChange={e => setLabelType(e.target.value)} placeholder="tag name..." style={{ width: 100, fontSize: 12 }} />
            <datalist id="tag-type-lib">{tagTypes.map(t => <option key={t} value={t} />)}</datalist>
            {characters.length === 0 && <span style={{ color: '#999' }}>Add characters above first</span>}
            {characters.map(c => (
              <label key={c} style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
                <input type="checkbox" checked={selChars.includes(c)}
                  onChange={e => setSelChars(e.target.checked ? [...selChars, c] : selChars.filter(x => x !== c))} />
                {c}
              </label>
            ))}
            <SegButtons value={direction} onChange={setDirection} options={[['up', '↑'], ['down', '↓']]} />
            <input value={note} onChange={e => setNote(e.target.value)} placeholder="note" style={{ width: 90, fontSize: 12 }} />
          </>
        ) : (
          <>
            <SegButtons value={role} onChange={setRole} options={[['setup', 'Setup'], ['step', 'Step'], ['payoff', 'Payoff']]} />
            <input list="thread-lib" value={threadName} onChange={e => setThreadName(e.target.value)} placeholder="thread name" style={{ width: 110, fontSize: 12 }} />
            <datalist id="thread-lib">{threads.map(t => <option key={t} value={t} />)}</datalist>
          </>
        )}
        <button onClick={addTags} style={{ fontSize: 12, border: '1px solid #ccc', borderRadius: 6, padding: '2px 8px', cursor: 'pointer' }}>+ Add</button>
      </div>
    </div>
  );
}

function ValueEditor({ cardValues, onChange, valuesLib }) {

    if (active.includes(name)) onChange(cardValues.filter(v => v.name !== name));
    else onChange([...cardValues, { name, shift: 0 }]);

  if (valuesLib.length === 0) return null;
  return (
    <div style={{ fontSize: 12, marginTop: 6 }}>

        <ShiftRow name={valuesLib[0]} shift={(cardValues.find(v => v.name === valuesLib[0]) || {}).shift || 0}

      title={confirming ? `Click again to confirm — ${label}` : label}

        border: 'none', background: 'none', cursor: 'pointer', padding: 1, display: 'inline-flex',

/* ============================== SCENE (WRITE) VIEW ============================== */

function SceneView({ state, setState, chapterFilter, help }) {
  const { cards, characters, themes, values, threads, chapters, tagTypes } = state;
  const [showUnassignedOnly, setShowUnassignedOnly] = useState(false);

  const defaultChapterId = chapterFilter !== 'all' ? chapterFilter : (chapters[0] && chapters[0].id) || null;

  const updateCard = (id, patch) => setState(s => ({ ...s, cards: s.cards.map(c => c.id === id ? { ...c, ...patch } : c) }));
  const removeCard = (id) => setState(s => ({ ...s, cards: s.cards.filter(c => c.id !== id) }));
  const addCard = () => setState(s => {
    const arr = [...s.cards];
    let insertAt = arr.length;
    if (defaultChapterId) {
      for (let i = arr.length - 1; i >= 0; i--) { if (arr[i].chapterId === defaultChapterId) { insertAt = i + 1; break; } }
    }
    arr.splice(insertAt, 0, { id: uid(), act: null, gapIndex: null, chapterId: defaultChapterId, title: 'New Card', text: '', notes: '', tags: [], values: [], placeholder: GENERIC_PLACEHOLDER, customColor: null, major: false });
    return { ...s, cards: arr };
  });
  const nudge = (idx, dir) => setState(s => ({ ...s, cards: nudgeWithActAdoption(s.cards, idx, dir) }));
  const insertCardAt = (afterIndex) => setState(s => {
    const arr = [...s.cards];
    const before = arr[afterIndex];
    const after = arr[afterIndex + 1];
    const inheritedAct = before ? before.act : (after ? after.act : null);
    const inheritedChapter = before ? before.chapterId : (after ? after.chapterId : defaultChapterId);
    arr.splice(afterIndex + 1, 0, { id: uid(), act: inheritedAct, gapIndex: null, chapterId: inheritedChapter, title: 'New Card', text: '', notes: '', tags: [], values: [], placeholder: GENERIC_PLACEHOLDER, customColor: null, major: false });
    return { ...s, cards: arr };
  });

  const addLib = (key) => (item) => setState(s => s[key].includes(item) ? s : { ...s, [key]: [...s[key], item] });
  const removeLib = (key) => (item) => setState(s => ({ ...s, [key]: s[key].filter(x => x !== item) }));

  const visibleCards = cards.map((c, i) => ({ c, i }))
    .filter(({ c }) => !showUnassignedOnly || c.act === null)
    .filter(({ c }) => chapterFilter === 'all' || c.chapterId === chapterFilter);

  return (
    <div style={{ maxWidth: 820, margin: '0 auto', padding: '12px 16px' }}>
      <ChipBar label="Characters" items={characters} onAdd={addLib('characters')} onRemove={removeLib('characters')} />
      <ChipBar label="Themes" items={themes} onAdd={addLib('themes')} onRemove={removeLib('themes')} />
      <ChipBar label="Story Values" items={values} onAdd={addLib('values')} onRemove={removeLib('values')} />
      <HelpNote on={help}>Cards run top to bottom in story order. Each card's placeholder prompt (e.g. "What change turns the plot?") is just a nudge — replace it with your own text, or leave it blank.</HelpNote>

      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', margin: '12px 0' }}>
        <label style={{ fontSize: 13, display: 'flex', alignItems: 'center', gap: 6 }}>
          <input type="checkbox" checked={showUnassignedOnly} onChange={e => setShowUnassignedOnly(e.target.checked)} />
          Show only unassigned
        </label>
        <button onClick={addCard} style={{ fontSize: 13, border: '1px solid #ccc', borderRadius: 8, padding: '4px 10px', cursor: 'pointer' }}>+ New Card</button>
      </div>

      {visibleCards.length > 0 && <InsertDivider onInsert={() => insertCardAt(visibleCards[0].i - 1)} />}
      {visibleCards.map(({ c, i }, j) => (
        <React.Fragment key={c.id}>
        <CardFields
          card={c} updateCard={p => updateCard(c.id, p)} characters={characters} threads={threads}
          valuesLib={values} onAddThread={addLib('threads')} tagTypes={tagTypes} onAddTagType={addLib('tagTypes')}
          showNudgeDelete onNudge={dir => nudge(i, dir)} onDelete={() => removeCard(c.id)}
          nudgeDisabled={{ up: i === 0, down: i === cards.length - 1 }}
        />
        <InsertDivider onInsert={() => insertCardAt(i)} />
        </React.Fragment>
      ))}
    </div>
  );
}

const btnStyle = { border: '1px solid #ddd', background: '#fff', borderRadius: 6, cursor: 'pointer', fontSize: 12, padding: '2px 6px' };
const chipStyle = { border: '1px solid #ddd', background: '#fff', color: '#333', borderRadius: 999, cursor: 'pointer', fontSize: 12, padding: '4px 12px' };

/* ============================== FLOWCHART VIEW ============================== */

// One chapter's five-Act-plus-Unassigned column strip. `cards` is always the FULL global
// array (needed so index-based splicing in setState stays correct) — filtering to this
// chapter happens internally.
function FlowchartChapterRow({ chapterId, cards, setState, onOpenPopup }) {
  const setAct = (id, act) => setState(s => ({ ...s, cards: s.cards.map(c => c.id === id ? { ...c, act } : c) }));

  const insertCard = (afterIndex, act) => setState(s => {
    const arr = [...s.cards];
    const newCard = { id: uid(), act, gapIndex: null, chapterId, title: 'New Card', text: '', notes: '', tags: [], values: [], placeholder: GENERIC_PLACEHOLDER, customColor: null, major: false };
    arr.splice(afterIndex + 1, 0, newCard);
    return { ...s, cards: arr };
  });

  const nudgeInColumn = (colCards, localIdx, dir) => {
    const target = colCards[localIdx + dir];
    if (!target) return;
    const trueA = colCards[localIdx].i, trueB = target.i;
    setState(s => {
      const arr = [...s.cards];
      [arr[trueA], arr[trueB]] = [arr[trueB], arr[trueA]];
      return { ...s, cards: arr };
    });
  };

  const columnsOrder = [...ACTS, 0]; // Act I..V, then Unassigned — used to find neighbouring columns
  const getAdjacentColAct = (colAct, dir) => {
    const idx = columnsOrder.indexOf(colAct);
    const j = idx + dir;
    if (j < 0 || j >= columnsOrder.length) return undefined;
    return columnsOrder[j];
  };

  // Moves a card into a neighbouring act column within THIS chapter: 'end' = bottom of the
  // previous act (top card nudged up), 'start' = top of the next act (bottom card nudged down).
  const moveCardAcrossAct = (cardId, targetColAct, position) => setState(s => {
    const arr = [...s.cards];
    const idx = arr.findIndex(c => c.id === cardId);
    if (idx === -1) return s;
    const [card] = arr.splice(idx, 1);
    const targetAct = targetColAct === 0 ? null : targetColAct;
    const moved = { ...card, act: targetAct };
    const actEntries = arr.map((c, i) => ({ c, i })).filter(({ c }) => c.chapterId === chapterId && (targetColAct === 0 ? c.act === null : c.act === targetColAct));
    let insertAt;
    if (actEntries.length === 0) insertAt = arr.length;
    else if (position === 'start') insertAt = actEntries[0].i;
    else insertAt = actEntries[actEntries.length - 1].i + 1;
    arr.splice(insertAt, 0, moved);
    return { ...s, cards: arr };
  });

  const columns = [...ACTS, 0]; // unassigned bucket placed after Act V

  return (
    <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start' }}>
      {columns.map(colAct => {
        const bg = colAct === 0 ? UNASSIGNED_COLOR : ACT_COLORS[colAct];
        const border = colAct === 0 ? UNASSIGNED_BORDER : ACT_BORDERS[colAct];
        const colCards = cards.map((c, i) => ({ c, i })).filter(({ c }) => c.chapterId === chapterId && (colAct === 0 ? c.act === null : c.act === colAct));
        const chapterCardIdxs = cards.map((c, i) => ({ c, i })).filter(({ c }) => c.chapterId === chapterId);
        const insertAct = colAct === 0 ? null : colAct;
        const topInsertAfterIndex = colCards.length > 0 ? colCards[0].i - 1 : (chapterCardIdxs.length > 0 ? chapterCardIdxs[chapterCardIdxs.length - 1].i : cards.length - 1);
        const prevColAct = getAdjacentColAct(colAct, -1);
        const nextColAct = getAdjacentColAct(colAct, 1);
        return (
          <div key={colAct} style={{ minWidth: 220, flex: 1, background: bg, border: `1px solid ${border}`, borderRadius: 10, padding: 8 }}>
            <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 8, color: '#555' }}>
              {colAct === 0 ? 'Unassigned' : ACT_NAMES[colAct]}
            </div>
            <FlowInsertDivider onInsert={() => insertCard(topInsertAfterIndex, insertAct)} />
            {colCards.map(({ c, i }, localIdx) => {
              const isTop = localIdx === 0;
              const isBottom = localIdx === colCards.length - 1;
              const upDisabled = isTop ? prevColAct === undefined : false;
              const downDisabled = isBottom ? nextColAct === undefined : false;
              const onUp = () => isTop ? moveCardAcrossAct(c.id, prevColAct, 'end') : nudgeInColumn(colCards, localIdx, -1);
              const onDown = () => isBottom ? moveCardAcrossAct(c.id, nextColAct, 'start') : nudgeInColumn(colCards, localIdx, 1);
              return (
                <React.Fragment key={c.id}>
                  <div style={{ background: resolveColor(c), border: `1px solid ${resolveBorder(c)}`, borderRadius: 8, padding: 8 }}
                    onDoubleClick={() => onOpenPopup(c.id)}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                      <input value={c.title} onChange={e => setState(s => ({ ...s, cards: s.cards.map(cc => cc.id === c.id ? { ...cc, title: e.target.value } : cc) }))}
                        onClick={e => e.stopPropagation()} onDoubleClick={e => e.stopPropagation()}
                        style={{ fontSize: 13, fontWeight: 600, flex: 1, border: 'none', background: 'transparent', padding: 0, minWidth: 0 }} />
                      <div style={{ display: 'flex', gap: 2 }}>
                        <button onClick={() => onOpenPopup(c.id)} style={btnStyle} title="Open details">✎</button>
                        <button onClick={onUp} disabled={upDisabled} style={{ ...btnStyle, opacity: upDisabled ? 0.35 : 1 }}
                          title={isTop ? (prevColAct !== undefined ? `Move to ${prevColAct === 0 ? 'Unassigned' : ACT_NAMES[prevColAct]}` : undefined) : undefined}>↑</button>
                        <button onClick={onDown} disabled={downDisabled} style={{ ...btnStyle, opacity: downDisabled ? 0.35 : 1 }}
                          title={isBottom ? (nextColAct !== undefined ? `Move to ${nextColAct === 0 ? 'Unassigned' : ACT_NAMES[nextColAct]}` : undefined) : undefined}>↓</button>
                      </div>
                    </div>
                    <select value={c.act === null ? '' : c.act} onChange={e => setAct(c.id, e.target.value ? parseInt(e.target.value, 10) : null)}
                      style={{ fontSize: 11, marginTop: 4 }}>
                      <option value="">Unassigned</option>
                      {ACTS.map(a => <option key={a} value={a}>{ACT_NAMES[a]}</option>)}
                    </select>
                  </div>
                  <FlowInsertDivider onInsert={() => insertCard(i, insertAct)} />
                </React.Fragment>
              );
            })}
            {colCards.length === 0 && <div style={{ fontSize: 12, color: '#999', textAlign: 'center' }}>No cards</div>}
          </div>
        );
      })}
    </div>
  );
}

function FlowchartView({ state, setState, chapterFilter, expandedChapterIds, setExpandedChapterIds, help }) {
  const { cards, characters, threads, values, chapters, tagTypes } = state;
  const scrollRef = useRef(null);
  const [popupCard, setPopupCard] = useState(null);
  const [jumpTo, setJumpTo] = useState('');

  useEffect(() => {
    const handler = (e) => {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (!scrollRef.current) return;
      if (e.key === 'ArrowRight') scrollRef.current.scrollLeft += 60;
      if (e.key === 'ArrowLeft') scrollRef.current.scrollLeft -= 60;
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const updateCard = (id, patch) => setState(s => ({ ...s, cards: s.cards.map(c => c.id === id ? { ...c, ...patch } : c) }));
  const nudgeCard = (cardId, dir) => setState(s => {
    const idx = s.cards.findIndex(c => c.id === cardId);
    if (idx === -1) return s;
    return { ...s, cards: nudgeWithActAdoption(s.cards, idx, dir) };
  });

  const addLib = (key) => (item) => setState(s => s[key].includes(item) ? s : { ...s, [key]: [...s[key], item] });

  const visibleChapters = chapterFilter === 'all' ? chapters : chapters.filter(ch => ch.id === chapterFilter);
  const showCollapsible = chapterFilter === 'all' && chapters.length > 1;

  const isExpanded = (id) => !showCollapsible || expandedChapterIds.includes(id);
  const toggleExpanded = (id) => setExpandedChapterIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  const expandAll = () => setExpandedChapterIds(chapters.map(ch => ch.id));
  const collapseAll = () => setExpandedChapterIds([]);

  const jumpToChapter = (id) => {
    if (!id) return;
    if (!expandedChapterIds.includes(id)) setExpandedChapterIds(prev => [...prev, id]);
    setTimeout(() => {
      const el = document.getElementById('flow-chapter-row-' + id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 0);
  };

  const cardCountFor = (chapterId) => cards.filter(c => c.chapterId === chapterId).length;

  return (
    <div style={{ padding: '12px 16px' }}>
      <HelpNote on={help}>Cards are grouped by chapter and act. Click a chapter header to collapse it, or use "Expand all" / "Collapse all" and the jump menu to navigate a long story.</HelpNote>
      {showCollapsible && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12, flexWrap: 'wrap' }}>
          <div style={{ display: 'flex', gap: 3, flex: 1, minWidth: 120 }}>
            {chapters.map(ch => (
              <div key={ch.id} onClick={() => jumpToChapter(ch.id)} title={ch.title}
                style={{ height: 6, borderRadius: 3, flex: 1, cursor: 'pointer', background: isExpanded(ch.id) ? '#5b8def' : '#e0e0e0' }} />
            ))}
          </div>
          <select value={jumpTo} onChange={e => { jumpToChapter(e.target.value); setJumpTo(''); }}
            style={{ fontSize: 12, border: '1px solid #ddd', borderRadius: 8, padding: '3px 6px' }}>
            <option value="">Jump to...</option>
            {chapters.map(ch => <option key={ch.id} value={ch.id}>{ch.title}</option>)}
          </select>
          <button onClick={expandAll} style={btnStyle}>Expand all</button>
          <button onClick={collapseAll} style={btnStyle}>Collapse all</button>
        </div>
      )}
      <div ref={scrollRef} style={{ display: 'flex', flexDirection: 'column', gap: 8, overflowX: 'auto', paddingBottom: 12 }}>
        {visibleChapters.map(ch => {
          const open = isExpanded(ch.id);
          return (
            <div key={ch.id} id={'flow-chapter-row-' + ch.id} style={showCollapsible ? { border: '1px solid #eee', borderRadius: 10 } : undefined}>
              <div
                onClick={showCollapsible ? () => toggleExpanded(ch.id) : undefined}
                style={{
                  display: 'flex', alignItems: 'center', gap: 8, fontWeight: 600, fontSize: 14,
                  padding: showCollapsible ? '8px 12px' : '0 0 6px', cursor: showCollapsible ? 'pointer' : 'default',
                  background: showCollapsible ? '#fafafa' : 'transparent', borderRadius: showCollapsible ? '10px 10px 0 0' : 0,
                }}>
                {showCollapsible && <span style={{ fontSize: 11, color: '#999', width: 10 }}>{open ? '▾' : '▸'}</span>}
                <span style={{ flex: 1 }}>{ch.title}</span>
                {showCollapsible && <span style={{ fontSize: 11, color: '#999', fontWeight: 400 }}>{cardCountFor(ch.id)} cards</span>}
              </div>
              {open && (
                <div style={{ padding: showCollapsible ? 12 : 0 }}>
                  <FlowchartChapterRow chapterId={ch.id} cards={cards} setState={setState} onOpenPopup={setPopupCard} />
                </div>
              )}
            </div>
          );
        })}
      </div>
      {popupCard && (
        <CardEditModal
          card={cards.find(c => c.id === popupCard)} cards={cards} onClose={() => setPopupCard(null)}
          updateCard={p => updateCard(popupCard, p)} onNudge={dir => nudgeCard(popupCard, dir)}
          onDelete={() => setState(s => ({ ...s, cards: s.cards.filter(c => c.id !== popupCard) }))}
          characters={characters} threads={threads} valuesLib={values} onAddThread={addLib('threads')}
          tagTypes={tagTypes} onAddTagType={addLib('tagTypes')}
        />
      )}
    </div>
  );
}

function FlowInsertDivider({ onInsert }) {

          +
        </button>
      )}

/* ============================== STORY CIRCLE VIEW ============================== */

function angleForGapCard(gapIndex, posInGap, totalInGap) {
  const gapStart = -90 + gapIndex * 45; // 12 o'clock start, clockwise
  const span = 40; // leave small margin within 45deg gap
  if (totalInGap <= 1) return gapStart + 22.5;
  return gapStart + 2.5 + (span * posInGap) / (totalInGap - 1);
}

function polar(cx, cy, r, angleDeg) {
  const a = (angleDeg * Math.PI) / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}

// Automatically distributes cards around the 8 circle gaps, preserving Scene order.
function autoDistributeGaps(cards) {
  const n = cards.length;
  const gapIndexById = {};
  if (n === 0) return gapIndexById;
  const base = Math.floor(n / 8), extra = n % 8;
  let idx = 0;
  for (let g = 0; g < 8; g++) {
    const count = base + (g < extra ? 1 : 0);
    for (let k = 0; k < count; k++) {
      gapIndexById[cards[idx].id] = g;
      idx++;
    }
  }
  return gapIndexById;
}

function CircleView({ state, setState, pinnedIds, setPinnedIds, chapterFilter, onBackToRing, help }) {
  const { cards: allCards, characters, threads, values, chapters, tagTypes, threadNotes, threadColors } = state;
  const cards = useMemo(() => filterByChapter(allCards, chapterFilter), [allCards, chapterFilter]);
  const stages = (state.circleStages && state.circleStages.length === 8) ? state.circleStages : CIRCLE_STAGES;
  const stagesHidden = !!state.circleStagesHidden;
  const [stagesOpen, setStagesOpen] = useState(false);
  const [stagesDraft, setStagesDraft] = useState(stages);
  const [stagesHiddenDraft, setStagesHiddenDraft] = useState(stagesHidden);
  const openStagesEditor = () => { setStagesDraft(stages); setStagesHiddenDraft(stagesHidden); setStagesOpen(true); };
  const saveStages = () => {
    setState(s => ({ ...s, circleStages: stagesDraft.map(x => x.trim() || 'Untitled'), circleStagesHidden: stagesHiddenDraft }));
    setStagesOpen(false);
  };
  const [zoom, setZoom] = useState('full'); // full | compact
  const [hoveredId, setHoveredId] = useState(null);
  const [popupCard, setPopupCard] = useState(null);
  const [chipStack, setChipStack] = useState(null); // array of card ids, or null when closed
  const [mode, setMode] = useState('story'); // story | threads
  const [lockedThreads, setLockedThreads] = useState([]); // persisted locked thread names, no cap
  const [hoverThread, setHoverThread] = useState(null);
  const [threadPopup, setThreadPopup] = useState(null);
  const [ringRotation, setRingRotation] = useState(0); // degrees; cards/labels stay upright, only position moves

  const togglePin = (id) => setPinnedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);

  const size = 1100;
  const cx = size / 2, cy = size / 2;
  const anchorR = 178;
  const cardR = 400;
  const cardW = zoom === 'compact' ? 150 : 200;

  const gapIndexById = useMemo(() => autoDistributeGaps(cards), [cards]);
  const gaps = Array.from({ length: 8 }, (_, g) => cards.map((c, i) => ({ c, i })).filter(({ c }) => gapIndexById[c.id] === g));

  const updateCard = (id, patch) => setState(s => ({ ...s, cards: s.cards.map(c => c.id === id ? { ...c, ...patch } : c) }));
  const removeCard = (id) => { setState(s => ({ ...s, cards: s.cards.filter(c => c.id !== id) })); setChipStack(prev => prev ? prev.filter(x => x !== id) : prev); };
  const addLib = (key) => (item) => setState(s => s[key].includes(item) ? s : { ...s, [key]: [...s[key], item] });
  const nudgeCard = (cardId, dir) => setState(s => {
    const idx = s.cards.findIndex(c => c.id === cardId);
    if (idx === -1) return s;
    return { ...s, cards: nudgeWithActAdoption(s.cards, idx, dir) };
  });
  const insertIntoStack = (pos) => {
    if (!chipStack) return;
    const newId = uid();
    setState(s => {
      const refId = pos < chipStack.length ? chipStack[pos] : chipStack[chipStack.length - 1];
      const idx = s.cards.findIndex(c => c.id === refId);
      if (idx === -1) return s;
      const ref = s.cards[idx];
      const insertAt = pos < chipStack.length ? idx : idx + 1;
      const arr = [...s.cards];
      arr.splice(insertAt, 0, { id: newId, act: ref.act, gapIndex: null, chapterId: ref.chapterId, title: 'New Card', text: '', notes: '', tags: [], values: [], placeholder: GENERIC_PLACEHOLDER, customColor: null, major: false });
      return { ...s, cards: arr };
    });
    let newStack = [...chipStack];
    newStack.splice(pos, 0, newId);
    if (newStack.length > 3) {
      if (pos === 0) newStack.pop(); else newStack.shift();
    }
    setChipStack(newStack);
  };


  // Angle for every card, resolved once from gap position — stable regardless of
  // pin/hover-driven paint-order changes below, and reused for the thread hub lines.
  const angleById = {};
  gaps.forEach((gapCards, g) => { gapCards.forEach(({ c }, pos) => { angleById[c.id] = angleForGapCard(g, pos, gapCards.length) + ringRotation; }); });
  const cardPos = {};
  cards.forEach(c => { cardPos[c.id] = polar(cx, cy, cardR, angleById[c.id]); });

  // Thread setups/payoffs derived from card tags, plus a stable colour and hub point per thread.
  const threadData = useMemo(() => {
    const map = {};
    threads.forEach(name => { map[name] = { setups: [], payoffs: [], steps: [] }; });
    cards.forEach(c => {
      (c.tags || []).forEach(t => {
        if (t.type === 'Thread') {
          if (!map[t.note]) map[t.note] = { setups: [], payoffs: [], steps: [] };
          if (t.role === 'setup') map[t.note].setups.push(c.id);
          else if (t.role === 'step') map[t.note].steps.push({ cardId: c.id });
          else map[t.note].payoffs.push(c.id);
        }
      });
    });
    const order = chronoOrderMap(allCards, chapters);
    Object.values(map).forEach(d => { d.steps = numberThreadSteps(d.steps, order); });
    return map;
  }, [allCards, cards, threads, chapters]);
  const threadNames = threads;
  const threadColor = (name) => (threadColors && threadColors[name]) || THREAD_COLORS[hashColorIndex(name) % THREAD_COLORS.length] || '#888780';
  const threadHub = (name) => {
    const i = threadNames.indexOf(name);
    const n = threadNames.length;
    const off = i - (n - 1) / 2;
    return { x: cx + off * 30, y: cy + off * 15 };
  };
  const cardThreadsOf = (cardId) => {
    const names = [];
    for (const name of threadNames) {
      const d = threadData[name];
      if (d && (d.setups.includes(cardId) || d.payoffs.includes(cardId) || d.steps.some(s => s.cardId === cardId))) names.push(name);
    }
    return names;
  };
  const toggleLockedThread = (name) => setLockedThreads(prev =>
    prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
  const ensureLockedThread = (name) => setLockedThreads(prev =>
    prev.includes(name) ? prev : [...prev, name]);
  const effectiveThreads = hoverThread && !lockedThreads.includes(hoverThread) ? [...lockedThreads, hoverThread] : lockedThreads;

  // Thread editorial helpers — operate on the global card array (threads can span chapters).
  const addThreadRole = (threadName, cardId, role, stepNum) => setState(s => ({
    ...s, cards: s.cards.map(c => c.id === cardId
      ? { ...c, tags: [...c.tags, { id: uid(), type: 'Thread', role, note: threadName }] }
      : c),
  }));
  const createAndAddRole = (threadName, title, role, stepNum) => {
    const defaultChapterId = (chapterFilter && chapterFilter !== 'all') ? chapterFilter
      : ((chapters[chapters.length - 1] && chapters[chapters.length - 1].id) || null);
    setState(s => ({
      ...s, cards: [...s.cards, {
        id: uid(), act: null, gapIndex: null, chapterId: defaultChapterId, title, text: '', notes: '',
        tags: [{ id: uid(), type: 'Thread', role, note: threadName }],
        values: [], placeholder: GENERIC_PLACEHOLDER, customColor: null, major: false,
      }],
    }));
  };
  const removeThreadTag = (cardId, tagId) => setState(s => ({
    ...s, cards: s.cards.map(c => c.id === cardId ? { ...c, tags: c.tags.filter(t => t.id !== tagId) } : c),
  }));
  const renameThread = (oldName, newName) => setState(s => {
    if (!newName.trim() || newName === oldName) return s;
    const notes = { ...s.threadNotes };
    if (oldName in notes) { notes[newName] = notes[oldName]; delete notes[oldName]; }
    const colors = { ...(s.threadColors || {}) };
    if (oldName in colors) { colors[newName] = colors[oldName]; delete colors[oldName]; }
    const lanes = { ...(s.threadLanes || {}) };
    if (oldName in lanes) { lanes[newName] = lanes[oldName]; delete lanes[oldName]; }
    return {
      ...s,
      threads: s.threads.map(t => t === oldName ? newName : t),
      cards: s.cards.map(c => ({ ...c, tags: c.tags.map(t => (t.type === 'Thread' && t.note === oldName) ? { ...t, note: newName } : t) })),
      threadNotes: notes,
      threadColors: colors,
      threadLanes: lanes,
    };
  });
  const setThreadColorOverride = (name, hex) => setState(s => ({ ...s, threadColors: { ...(s.threadColors || {}), [name]: hex } }));
  const deleteThread = (name) => {
    setState(s => {
      const notes = { ...s.threadNotes };
      delete notes[name];
      const colors = { ...(s.threadColors || {}) };
      delete colors[name];
      const lanes = { ...(s.threadLanes || {}) };
      delete lanes[name];
      return {
        ...s,
        threads: s.threads.filter(t => t !== name),
        cards: s.cards.map(c => ({ ...c, tags: c.tags.filter(t => !(t.type === 'Thread' && t.note === name)) })),
        threadNotes: notes,
        threadColors: colors,
        threadLanes: lanes,
      };
    });
    setThreadPopup(null);
    setLockedThreads(prev => prev.filter(n => n !== name));
  };
  const updateThreadNotes = (name, text) => setState(s => ({ ...s, threadNotes: { ...s.threadNotes, [name]: text } }));

  // Flat, angle-resolved render order (matches Scene order). SVG paints elements in
  // document order and does not respect CSS z-index between sibling <foreignObject>s,
  // so "bring to front" is done by moving a card to the END of this render list rather
  // than via z-index — this also fixes the first card being unable to front the last.
  let renderList = gaps.flatMap((gapCards, g) => gapCards.map(({ c, i }, pos) => ({
    c, i, angle: angleForGapCard(g, pos, gapCards.length) + ringRotation,
  })));
  if (pinnedIds.length > 0) {
    pinnedIds.forEach(id => {
      const idx = renderList.findIndex(o => o.c.id === id);
      if (idx !== -1) renderList.push(renderList.splice(idx, 1)[0]);
    });
  }
  if (hoveredId && !pinnedIds.includes(hoveredId)) {
    const idx = renderList.findIndex(o => o.c.id === hoveredId);
    if (idx !== -1) renderList.push(renderList.splice(idx, 1)[0]);
  }

  return (
    <div style={{ padding: 16 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
        <div style={{ display: 'flex', gap: 2, background: '#f4f4f4', borderRadius: 8, padding: 2 }}>
          <button onClick={() => setMode('story')} style={{ ...btnStyle, border: 'none', background: mode === 'story' ? '#fff' : 'transparent', fontWeight: mode === 'story' ? 600 : 400 }}>Story</button>
          <button onClick={() => setMode('threads')} style={{ ...btnStyle, border: 'none', background: mode === 'threads' ? '#fff' : 'transparent', fontWeight: mode === 'threads' ? 600 : 400 }}>Threads</button>
        </div>
        {/* Compact zoom toggle removed (wasn't doing anything distinct from full) — zoom stays 'full'.
            ZoomControls + the 'compact' branches (cardW, etc.) are left in place below in case
            a real compact layout gets built later. */}
        <button onClick={() => setPinnedIds([])} style={btnStyle} title="Unpin everything and restore cascading stack order">Reset stacking</button>
        {mode === 'story' && (
          <button onClick={openStagesEditor} style={btnStyle} title="Rename or hide the eight stage labels around the ring">✎ Stage labels</button>
        )}
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }} title="Spin the ring — cards and labels stay upright, only their position moves">
          <span style={{ fontSize: 12, color: '#888' }}>Rotate</span>
          <input type="range" min={0} max={359} step={1} value={ringRotation}
            onChange={e => setRingRotation(Number(e.target.value))} style={{ width: 100 }} />
          {ringRotation !== 0 && (
            <button onClick={() => setRingRotation(0)} style={{ ...btnStyle, padding: '2px 8px' }} title="Reset rotation">Reset</button>
          )}
        </div>
        {onBackToRing && (

      {stagesOpen && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.35)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}
          onClick={() => setStagesOpen(false)}>
          <div style={{ background: '#fff', borderRadius: 10, width: 340, padding: 20, boxShadow: '0 8px 30px rgba(0,0,0,0.25)' }}

            </div>

        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, margin: '10px 0' }}>

          {threadNames.map(name => (
            <button key={name} onClick={() => { ensureLockedThread(name); setThreadPopup(name); }}
              style={{ ...chipStyle, display: 'flex', alignItems: 'center', gap: 5, ...(lockedThreads.includes(name) ? chipActiveStyle : {}) }}>
              <span style={{ width: 8, height: 8, borderRadius: '50%', background: threadColor(name), display: 'inline-block' }} />
              {name}

          ))}
          {threadNames.length === 0 && <span style={{ fontSize: 12, color: '#999' }}>No threads yet — tag a card as a Thread setup or payoff first.</span>}
        </div>

      <div style={{ display: 'flex', gap: 12, alignItems: 'stretch' }}>
        <div style={{ flex: 1, minWidth: 0, overflow: 'auto', border: '1px solid #eee', borderRadius: 10 }}>
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}
            onClick={() => { if (mode === 'threads') setLockedThreads([]); }}>
          {mode === 'story' && (
            <>
              <circle cx={cx} cy={cy} r={anchorR} fill="none" stroke="#ddd" />
              {!stagesHidden && stages.map((stage, i) => {
                const angle = -90 + i * 45 + ringRotation;
                const p = polar(cx, cy, anchorR, angle);
                const lozW = stage.length * 9 + 26;
                const lozH = 28;

                  <foreignObject key={i} x={p.x - lozW / 2} y={p.y - lozH / 2} width={lozW} height={lozH} style={{ overflow: 'visible' }}>

                      borderRadius: 14, display: 'flex', alignItems: 'center', justifyContent: 'center',
                      fontSize: 13, fontWeight: 600, color: '#555',
                    }}>{stage}</div>
                  </foreignObject>
                );
              })}
            </>
          )}
          {mode === 'threads' && threadNames.map(name => {
            const color = threadColor(name);
            const hub = threadHub(name);
            const isActive = effectiveThreads.length === 0 || effectiveThreads.includes(name);
            const lineOp = isActive ? 0.85 : 0.08;
            const hubOp = isActive ? 1 : 0.15;
            const enter = () => setHoverThread(name);
            const leave = () => setHoverThread(null);
            const lock = (e) => { e.stopPropagation(); toggleLockedThread(name); };
            const d = threadData[name] || { setups: [], payoffs: [] };
            return (
              <React.Fragment key={name}>
                {d.setups.map(cid => cardPos[cid] && (
                  <React.Fragment key={'s' + cid}>
                    <path d={`M${cardPos[cid].x} ${cardPos[cid].y} L${hub.x} ${hub.y}`} stroke={color} strokeWidth={10} opacity={0} style={{ cursor: 'pointer' }}
                      onMouseEnter={enter} onMouseLeave={leave} onClick={lock} />
                    <path d={`M${cardPos[cid].x} ${cardPos[cid].y} L${hub.x} ${hub.y}`} stroke={color} strokeWidth={2} opacity={lineOp} fill="none" />
                  </React.Fragment>
                ))}
                {d.payoffs.map(cid => cardPos[cid] && (
                  <React.Fragment key={'p' + cid}>
                    <path d={`M${hub.x} ${hub.y} L${cardPos[cid].x} ${cardPos[cid].y}`} stroke={color} strokeWidth={10} opacity={0} style={{ cursor: 'pointer' }}
                      onMouseEnter={enter} onMouseLeave={leave} onClick={lock} />
                    <path d={`M${hub.x} ${hub.y} L${cardPos[cid].x} ${cardPos[cid].y}`} stroke={color} strokeWidth={2} opacity={lineOp} fill="none" />
                  </React.Fragment>
                ))}
                <circle cx={hub.x} cy={hub.y} r={16} fill="transparent" style={{ cursor: 'pointer' }}
                  onMouseEnter={enter} onMouseLeave={leave}
                  onClick={(e) => { e.stopPropagation(); if (lockedThreads.includes(name)) setHoverThread(null); toggleLockedThread(name); }}
                  onDoubleClick={(e) => { e.stopPropagation(); ensureLockedThread(name); setThreadPopup(name); }} />
                <circle cx={hub.x} cy={hub.y} r={9} fill={color} opacity={hubOp} style={{ pointerEvents: 'none' }} />
              </React.Fragment>
            );
          })}
          {renderList.map(({ c, angle }) => {
            const p = polar(cx, cy, cardR, angle);
            const isFront = pinnedIds.includes(c.id) || hoveredId === c.id;
            const cardThreads = mode === 'threads' ? cardThreadsOf(c.id) : [];
            const dimmed = mode === 'threads' && effectiveThreads.length > 0 && !cardThreads.some(t => effectiveThreads.includes(t));
            return (
              <foreignObject key={c.id} x={p.x - cardW / 2} y={p.y - 30} width={cardW} height={60}
